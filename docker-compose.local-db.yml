# Use when MongoDB runs on your laptop (not in Docker).
# Backend connects via host.docker.internal (Docker Desktop on Windows/Mac).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://host.docker.internal:27017
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
