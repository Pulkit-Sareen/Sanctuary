version: '3.8'

services:
  frontend:
    build: 
      context: ./FRONTEND
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - LLM_API_KEY=${LLM_API_KEY}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
